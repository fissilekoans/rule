
name: Update HaGeZi Light and Pro++ for Surge

on:
  schedule:
    # 21:00 UTC = 05:00 the following day in Asia/Taipei.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hagezi-surge-list
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Convert HaGeZi lists to Surge DOMAIN-SET
        run: python3 scripts/convert_hagezi.py

      - name: Commit lists only when they change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "The generated lists have not changed."
          else
            git commit -m "Update HaGeZi Surge lists"
            git push
          fi
