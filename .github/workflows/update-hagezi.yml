name: Update HaGeZi Pro++ for Surge

on:
  schedule:
    # 20:17 UTC = 04:17 the following day in Asia/Taipei.
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hagezi-surge-list
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Convert HaGeZi list to Surge DOMAIN-SET
        run: python3 scripts/convert_hagezi.py

      - name: Commit list only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hagezi-pro-plus-surge.list

          if git diff --cached --quiet; then
            echo "The generated list has not changed."
          else
            git commit -m "Update HaGeZi Pro++ Surge list"
            git push
          fi
